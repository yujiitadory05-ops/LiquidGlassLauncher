name: Build Liquid Glass Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Extract project
        run: unzip -o LiquidGlassLauncher-Android-Source.zip

      - name: Build APK
        working-directory: LiquidGlassLauncher
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Liquid-Glass-Launcher-APK
          path: LiquidGlassLauncher/app/build/outputs/apk/debug/app-debug.apk
